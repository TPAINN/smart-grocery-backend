name: 🛒 Daily Grocery Scraper

on:
  # Τρέχει κάθε μέρα 05:00 UTC = 08:00 EEST (καλοκαίρι) / 07:00 EET (χειμώνας)
  schedule:
    - cron: '0 5 * * *'

  # Κουμπί Manual Run στο GitHub → Actions tab (για testing)
  workflow_dispatch:
    inputs:
      store:
        description: 'Specific store to scrape (leave empty for ALL)'
        required: false
        default: ''

jobs:
  scrape:
    name: Scrape all supermarkets
    runs-on: ubuntu-latest

    # Σκοτώνει τη δουλειά αν πάρει πάνω από 3 ώρες (extra safety net)
    timeout-minutes: 180

    steps:
      # ── 1. Κατέβασε τον κώδικα ─────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Node.js με npm cache ─────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # Node 24 LTS — Node 20 deprecated on GH Actions June 2026
          cache: 'npm'

      # ── 3. Εγκατάσταση dependencies ─────────────────────────────────────────
      # Skip puppeteer's own Chromium download: it left a CORRUPT/partial
      # extraction on the runner (zip present, chrome-linux64/chrome binary never
      # extracted) -> scraper crashed at launch with "executable is missing" every
      # day. We install a real Google Chrome below instead.
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      # ── 4. Chrome για Puppeteer ─────────────────────────────────────────────
      # FIX (2026-06-18): install the official Google Chrome .deb. It lands at
      # /usr/bin/google-chrome-stable, which scraper.js auto-detects via
      # SYSTEM_CHROME_PATHS. Deterministic and immune to puppeteer's flaky
      # downloader. We also export PUPPETEER_EXECUTABLE_PATH explicitly.
      - name: Install Google Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/chrome.deb
          CHROME_BIN="$(command -v google-chrome-stable)"
          "$CHROME_BIN" --version
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "✅ Chrome ready at $CHROME_BIN"

      # ── 5. Τρέξε το scraper ──────────────────────────────────────────────────
      - name: Run full scraper
        env:
          # Secret: βάλε στο GitHub → repo Settings → Secrets → MONGO_URI
          MONGO_URI: ${{ secrets.MONGO_URI }}

          # 'github' profile = no --single-process (fixes Sklavenitis/ΑΒ Session closed errors)
          # 5 workers × ~200MB Chrome = ~1GB + 3GB Node = ~4GB total (7GB runner — άνετα)
          SCRAPER_PROFILE: github
          SCRAPER_MAX_CONCURRENCY: '5'

          # Node.js heap: 3GB
          NODE_OPTIONS: '--max-old-space-size=3072'

          PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer

          # Αν πατήθηκε manual trigger με συγκεκριμένο store, χρησιμοποίησέ το
          TARGET_STORE: ${{ github.event.inputs.store }}

        run: |
          if [ -n "$TARGET_STORE" ]; then
            echo "🏪 Manual run — scraping only: $TARGET_STORE"
            node -e "
              require('node:dns/promises').setServers(['1.1.1.1','8.8.8.8']);
              process.env.SCRAPER_PROFILE='render';
              const mongoose = require('mongoose');
              const { runWebScraper } = require('./services/scraper');
              (async () => {
                await mongoose.connect(process.env.MONGO_URI, { maxPoolSize:3, serverSelectionTimeoutMS:15000 });
                await runWebScraper(process.env.TARGET_STORE);
                await mongoose.disconnect();
                process.exit(0);
              })().catch(e => { console.error(e); process.exit(1); });
            "
          else
            echo "🚀 Scheduled run — scraping ALL stores"
            node renderRunAll.js
          fi

      # ── 6. Σύνοψη στο GitHub Actions summary ───────────────────────────────
      - name: Job summary
        if: always()
        run: |
          echo "## 🛒 Scraper Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workers**: $SCRAPER_MAX_CONCURRENCY" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
