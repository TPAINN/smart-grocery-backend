# DISABLED — replaced by daily-scraper.yml which runs Puppeteer directly in GH Actions.
# This file used to ping the Render backend HTTP endpoint but was unreliable
# because Render free tier sleeps. Kept for reference only.
name: "[DISABLED] Daily Supermarket Scrape (Render HTTP trigger)"

on:
  # Disabled schedule — use daily-scraper.yml instead
  # schedule:
  #   - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      store:
        description: 'Specific store to scrape (leave empty for all)'
        required: false
        default: ''

jobs:
  trigger-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wake up Render backend
        # Render free tier sleeps after 15 min of inactivity. Ping health first.
        run: |
          echo "🔔 Waking up Render backend..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${{ secrets.BACKEND_URL }}/api/health")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is awake!"
              break
            fi
            echo "⏳ Not ready yet, waiting 20s..."
            sleep 20
          done

      - name: Trigger product scrape
        run: |
          STORE="${{ github.event.inputs.store }}"
          URL="${{ secrets.BACKEND_URL }}/api/force-scrape?secret=${{ secrets.CRON_SECRET }}"
          if [ -n "$STORE" ]; then
            URL="${URL}&store=${STORE}"
          fi
          echo "🚀 Triggering scrape..."
          RESPONSE=$(curl -sf --max-time 30 "$URL")
          echo "✅ Response: $RESPONSE"

      - name: Trigger recipe scrape
        run: |
          echo "👨‍🍳 Triggering recipe refresh..."
          curl -sf --max-time 30 "${{ secrets.BACKEND_URL }}/api/force-recipes?secret=${{ secrets.CRON_SECRET }}" \
            && echo "✅ Recipe scrape triggered" \
            || echo "⚠️ Recipe scrape trigger failed (non-critical)"
