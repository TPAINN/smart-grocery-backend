name: 🧹 Storage maintenance

# Runs where MONGO_URI already exists as a secret, so the connection string
# never has to be copied onto anyone's machine.
#
# Default is report-only. Deleting requires ticking `confirm` explicitly.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = look only · prune = delete old price history'
        required: true
        default: 'report'
        type: choice
        options: [report, drop-index, reindex, prune, set-ttl, prune-delisted]
      keep_days:
        description: 'Days of price history to keep (prune / set-ttl)'
        required: false
        default: '60'
      confirm:
        description: 'Actually delete. Unticked = dry run.'
        required: false
        default: false
        type: boolean

  # Weekly, report-only, so the cluster filling up is noticed before it blocks
  # writes again rather than three weeks after.
  schedule:
    - cron: '0 4 * * 1'

jobs:
  maintenance:
    name: Inspect and prune storage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run maintenance
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          ARGS=""
          case "${{ inputs.mode }}" in
            reindex)
              # Reclaims index space a mass delete stranded. No documents touched.
              ARGS="--reindex"
              ;;
            drop-index)
              # Frees index bytes without deleting a single document.
              ARGS="--drop-unused-indexes"
              ;;
            prune)
              ARGS="--prune --keep-days=${{ inputs.keep_days || 60 }}"
              ;;
            prune-delisted)
              # Removes products a chain has stopped selling. Only touches
              # chains that scraped in the last 48h, and skips any chain that
              # would lose more than 40% (that is a partial scrape, not
              # delisting). keep_days doubles as the staleness threshold.
              ARGS="--prune-delisted --stale-days=${{ inputs.keep_days || 30 }}"
              ;;
            set-ttl)
              # Moves the retention window in place via collMod. Editing
              # expireAfterSeconds in the Mongoose schema alone does nothing —
              # MongoDB keeps the existing index when the option differs.
              ARGS="--set-ttl-days=${{ inputs.keep_days || 7 }}"
              ;;
          esac
          if [ -n "$ARGS" ] && [ "${{ inputs.confirm }}" = "true" ]; then
            ARGS="$ARGS --confirm"
          fi
          echo "Running: storage-maintenance.js $ARGS"
          node scripts/storage-maintenance.js $ARGS
