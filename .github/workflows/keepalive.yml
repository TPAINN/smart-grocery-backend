name: Keep API warm

# Render's free tier spins the web service down after ~15 min of no inbound
# traffic, causing a 3-5s cold start on the next visit. This free GitHub Actions
# cron pings the health endpoint every ~10 min to keep it warm. Runtime is a few
# seconds per run — negligible against the free Actions minutes budget.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (beats the 15-min spin-down)
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health (wake + confirm)
        run: |
          URL="https://my-smart-grocery-api.onrender.com/api/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          # Don't fail the run on a transient cold start — avoids noisy alert emails.
          echo "health did not return 200 this run (likely a slow cold start)"
          exit 0
