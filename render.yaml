# render.yaml: the API on Render's FREE plan. Nothing here costs money.
#
# The daily price scraper does NOT run on Render: Render has no free plan for
# cron jobs (Starter is $7/month). It runs on GitHub Actions instead
# (.github/workflows/daily-scraper.yml), which is free and unlimited because
# this repository is public. Do not add a `type: cron` service here.
#
# The free web service sleeps after 15 minutes idle and wakes on the next
# request (~30 s). The app reads prices from its own Vercel functions first,
# so a sleeping API only matters as a fallback.

services:
  - type: web
    name: my-smart-grocery-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false