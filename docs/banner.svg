<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Καλαθάκι API — 71.000+ τιμές από 8 ελληνικά σούπερ μάρκετ. AI διατροφή. Real-time καλάθι.">
<title>Καλαθάκι API</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06140b"/><stop offset="1" stop-color="#150d06"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#4ade80" stop-opacity=".55"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#fb923c" stop-opacity=".45"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="clip"><rect width="1280" height="360" rx="22"/></clipPath>
<style>
.bar{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.4s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.3);opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 4s ease-out infinite}
@keyframes rg{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.15);opacity:0}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.glow{filter:drop-shadow(0 0 8px #4ade80)}
.blink{animation:bk 1.1s steps(2,start) infinite}
@keyframes bk{to{opacity:0}}
.sweep{animation:sw 3.4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateY(0)}50%{transform:translateY(272px)}}
.cell{animation:ce 3.2s ease-in-out infinite}
@keyframes ce{0%,100%{opacity:.25}50%{opacity:1}}
.scramble{animation:sc 3s ease-in-out infinite}
@keyframes sc{0%,100%{opacity:.15}30%,70%{opacity:1}}
.seg{transform-box:fill-box;transform-origin:left;animation:sg 3s ease-in-out infinite}
@keyframes sg{0%,100%{transform:scaleX(.2);opacity:.4}50%{transform:scaleX(1);opacity:1}}
.flip{transform-box:fill-box;transform-origin:center;animation:fp 5s ease-in-out infinite}
@keyframes fp{0%,40%,100%{transform:scaleX(1)}50%{transform:scaleX(.05)}60%,90%{transform:scaleX(1)}}
.ringbell{transform-box:fill-box;transform-origin:50% 8%;animation:rb 2.4s ease-in-out infinite}
@keyframes rb{0%,100%{transform:rotate(0)}15%{transform:rotate(9deg)}30%{transform:rotate(-9deg)}45%{transform:rotate(5deg)}60%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="360" fill="url(#bg)"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<circle cx="260" cy="40" r="260" fill="url(#orb)"><animate attributeName="cx" values="260;340;260" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="340" r="300" fill="url(#orb2)"><animate attributeName="cy" values="340;290;340" dur="11s" repeatCount="indefinite"/></circle>
<g class="float" style="animation-delay:-0s"><rect x="800" y="70" width="104" height="38" rx="19" fill="#0f1a14" stroke="#4ade80" stroke-opacity=".8"/><text x="852" y="95" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="17" font-weight="700" fill="#4ade80">€0,89</text></g><g class="float" style="animation-delay:-1.2s"><rect x="1100" y="80" width="104" height="38" rx="19" fill="#0f1a14" stroke="#fb923c" stroke-opacity=".8"/><text x="1152" y="105" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="17" font-weight="700" fill="#fb923c">€1,29</text></g><g class="float" style="animation-delay:-2.2s"><rect x="1130" y="250" width="104" height="38" rx="19" fill="#0f1a14" stroke="#4ade80" stroke-opacity=".8"/><text x="1182" y="275" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="17" font-weight="700" fill="#4ade80">€2,45</text></g><g class="float" style="animation-delay:-0.7s"><rect x="790" y="245" width="104" height="38" rx="19" fill="#0f1a14" stroke="#fb923c" stroke-opacity=".8"/><text x="842" y="270" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="17" font-weight="700" fill="#fb923c">€0,59</text></g><g class="float" style="animation-delay:-.4s"><path d="M900 120h40l28 100h110l24-76H950" fill="none" stroke="url(#g1)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="985" cy="252" r="12" fill="#4ade80"/><circle cx="1080" cy="252" r="12" fill="#fb923c"/><rect x="988" y="162" width="26" height="26" rx="6" fill="#4ade80" opacity=".9"/><rect x="1024" y="162" width="26" height="26" rx="6" fill="#fb923c" opacity=".9"/><rect x="1006" y="130" width="26" height="26" rx="6" fill="#fff" opacity=".7"/></g>
<text x="72" y="140" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#tt)">Καλαθάκι API</text>
<text x="72" y="200" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">71.000+ τιμές από 8 ελληνικά σούπερ μάρκετ. AI</text><text x="72" y="232" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">διατροφή. Real-time καλάθι.</text>
<g transform="translate(72 292)"><rect width="113" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#4ade80" stroke-opacity=".45"/><text x="56" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">Express 5</text></g><g transform="translate(195 292)"><rect width="94" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#4ade80" stroke-opacity=".45"/><text x="47" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">MongoDB</text></g><g transform="translate(299 292)"><rect width="113" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#4ade80" stroke-opacity=".45"/><text x="56" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">Puppeteer</text></g><g transform="translate(422 292)"><rect width="113" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#4ade80" stroke-opacity=".45"/><text x="56" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">Socket.IO</text></g>
<rect x="1" y="1" width="1278" height="358" rx="21" fill="none" stroke="url(#g1)" stroke-opacity=".35" stroke-width="1.5"/>
</g>
</svg>
